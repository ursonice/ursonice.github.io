name: Sync Notion posts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_IDS: ${{ secrets.NOTION_DATA_SOURCE_IDS }}
          NOTION_ABOUT_PAGE_ID: ${{ secrets.NOTION_ABOUT_PAGE_ID }}
          NOTION_VERSION: "2026-03-11"
        run: node scripts/sync-notion.mjs
      - name: Commit generated data
        run: |
          if [[ -n "$(git status --porcelain data/notion-posts.json assets/notion 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/notion-posts.json
            if [[ -d assets/notion ]]; then
              git add assets/notion
            fi
            git commit -m "Sync Notion posts"
            git push
          else
            echo "No changes to commit"
          fi
