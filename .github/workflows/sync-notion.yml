name: Sync Notion posts

on:
  workflow_dispatch:
  repository_dispatch:
    types: [notion-sync]
  schedule:
    # Fallback only — GitHub's scheduled cron is best-effort and heavily
    # throttled for short intervals. Real-time updates come from the
    # repository_dispatch trigger fired by Notion (see README).
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_IDS: ${{ secrets.NOTION_DATA_SOURCE_IDS }}
          NOTION_ABOUT_PAGE_ID: ${{ secrets.NOTION_ABOUT_PAGE_ID }}
          NOTION_VERSION: "2026-03-11"
        run: |
          node scripts/sync-notion.mjs
          node scripts/convert-heic.mjs
          node scripts/add-image-dims.mjs
          node scripts/gen-post-pages.mjs
          node scripts/gen-tag-pages.mjs
          node scripts/gen-home-page.mjs
      - name: Commit generated data
        run: |
          if [[ -n "$(git status --porcelain data/notion-posts.json assets/notion feed.xml sitemap.xml posts topics index.html 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/notion-posts.json feed.xml sitemap.xml posts topics index.html
            if [[ -d assets/notion ]]; then
              git add assets/notion
            fi
            git commit -m "Sync Notion posts"
            git push
          else
            echo "No changes to commit"
          fi
      - name: Notify IndexNow (Bing/Naver/Yandex)
        run: node scripts/notify-indexnow.mjs
        continue-on-error: true
