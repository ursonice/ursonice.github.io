name: Sync Notion posts

on:
  workflow_dispatch:
  repository_dispatch:
    types: [notion-sync]
  schedule:
    # Fallback only — GitHub's scheduled cron is best-effort and heavily
    # throttled for short intervals. Real-time updates come from the
    # repository_dispatch trigger fired by Notion (see README).
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_IDS: ${{ secrets.NOTION_DATA_SOURCE_IDS }}
          NOTION_ABOUT_PAGE_ID: ${{ secrets.NOTION_ABOUT_PAGE_ID }}
          NOTION_VERSION: "2026-03-11"
        run: npm run build
      - name: Commit generated data
        run: |
          if [[ -n "$(git status --porcelain data feed.xml sitemap.xml posts topics index.html 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data feed.xml sitemap.xml posts topics index.html
            if [[ -d assets/notion ]]; then
              git add assets/notion
            fi
            git commit -m "Sync Notion posts"
            # A human push during the multi-minute sync used to make this push fail
            # and drop the whole sync's output — rebase and retry instead.
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected — rebasing onto origin/main (attempt $i)"
              git pull --rebase origin main || exit 1
            done
          else
            echo "No changes to commit"
          fi
      - name: Notify IndexNow (Bing/Naver/Yandex)
        run: node scripts/notify-indexnow.mjs
        continue-on-error: true
