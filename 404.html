<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0e" />

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K7VKNXKJJ7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-K7VKNXKJJ7");
    </script>

    <title>404 — Woojae Joo</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/styles.css?v=8" />
    <script>
      (() => {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <main class="shell" style="min-height: 80vh; display: grid; place-items: center; text-align: center; padding: 80px 0;">
      <div>
        <p class="eyebrow">404</p>
        <h1 style="font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3.2rem); margin-bottom: 16px;">
          페이지를 찾을 수 없습니다
        </h1>
        <p style="color: var(--muted); margin-bottom: 28px;">
          주소가 바뀌었거나 삭제된 페이지일 수 있어요.
        </p>
        <a class="button" href="/">← 홈으로 돌아가기</a>
      </div>
    </main>
  </body>
</html>
