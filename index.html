<!DOCTYPE html>
  <html lang="ko">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WooJae's Homepage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    }
  .container {
        text-align: center;
    padding: 3rem;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    max-width: 600px;
}
  h1 { font-size: 3rem; margin-bottom: 1rem; }
  p { font-size: 1.2rem; margin-bottom: 1.5rem; line-height: 1.6; }
  .links a {
        display: inline-block;
    margin: 0.5rem;
    padding: 0.7rem 1.5rem;
    background: rgba(255,255,255,0.2);
    color: #fff;
        text-decoration: none;
    border-radius: 30px;
    transition: all 0.3s;
  }
  .links a:hover {
        background: rgba(255,255,255,0.4);
    transform: translateY(-2px);
  }
</style>
  </head>
  <body>
    <div class="container">
      <h1>Hello, I'm WooJae</h1>
      <p>웹사이트에 오신 것을 환영합니다!<br>이곳은 GitHub Pages로 만든 저의 개인 홈페이지입니다.</p>
      <div class="links">
        <a href="https://github.com/ursonice">GitHub</a>
        <a href="mailto:contact@example.com">Contact</a>
      </div>
    </div>
  </body>
  </html>
